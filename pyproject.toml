[project]
name = "leanwisp"
version = "0.1.0"
description = "Conservative parser-checked whitespace formatting for Lean 4"
requires-python = ">=3.15"
license = "Apache-2.0"
[project.scripts]
leanwisp = "leanwisp.cli:main"
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[tool.hatch.build.targets.wheel]
packages = ["src/leanwisp"]
[dependency-groups]
dev = ["pytest", "pytest-icdiff", "ruff"]
