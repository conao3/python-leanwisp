[package]
name = "leanwisp"
version = "0.2.0"
edition = "2024"
license = "Apache-2.0"
description = "A parser-aware Lean 4 source formatter with a Rust document renderer"
repository = "https://github.com/conao3/rust-leanwisp"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["unbounded_depth"] }
libc = "0.2"
